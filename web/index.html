  <style>
    body {
      background-color: #0F172A;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #E2E8F0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(220, 163, 17, 0.2);
      border-top-color: #DCA311;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      color: #94A3B8;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <div class="loader">
    <div class="spinner"></div>
    <div class="loader-text">Cargando Aduanas 801 (v2.10)...</div>
  </div>
  
  <!-- PWA Install Prompt -->
  <script>
    let deferredPrompt;
    const installBanner = document.createElement('div');
    installBanner.id = 'install-banner';
    installBanner.style = 'display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E293B;border:1px solid #F59E0B;border-radius:12px;padding:12px 24px;z-index:9999;display:flex;align-items:center;gap:12px;box-shadow:0 4px 24px rgba(0,0,0,0.4)';
    installBanner.innerHTML = `
      <span style="color:#E2E8F0;font-size:14px;font-family:system-ui">📱 <strong>Instala Aduanas 801</strong> en tu celular</span>
      <button id="install-btn" style="background:#F59E0B;color:#000;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:13px">Instalar</button>
      <button id="dismiss-btn" style="background:transparent;color:#64748B;border:none;cursor:pointer;font-size:18px">✕</button>
    `;
    
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!localStorage.getItem('pwa-dismissed')) {
        setTimeout(() => document.body.appendChild(installBanner), 3000);
      }
    });
    
    document.addEventListener('click', (e) => {
      if (e.target.id === 'install-btn' && deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { installBanner.remove(); deferredPrompt = null; });
      }
      if (e.target.id === 'dismiss-btn') {
        installBanner.remove();
        localStorage.setItem('pwa-dismissed', '1');
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
